<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Мессенджер</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100dvh;
    font-family: system-ui, -apple-system, sans-serif;
    background: #0f1115; color: #e6e6e6;
    overflow: hidden;
  }
  body { display: flex; flex-direction: column; }
  header {
    padding: 12px 16px; background: #181b22;
    border-bottom: 1px solid #262a33;
    display: flex; gap: 12px; align-items: center;
    padding-top: max(12px, env(safe-area-inset-top));
  }
  header input {
    background: #0f1115; border: 1px solid #2a2f3a;
    color: #e6e6e6; padding: 6px 10px; border-radius: 6px;
    font-size: 14px; width: 160px; outline: none;
  }
  header input:focus { border-color: #2563eb; }
  header .status {
    margin-left: auto; font-size: 12px; color: #6b7280;
  }
  header .status.on { color: #4ade80; }
  #log {
    flex: 1; overflow-y: auto; padding: 16px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .msg {
    max-width: 78%; padding: 8px 12px; border-radius: 12px;
    background: #1c2029; word-wrap: break-word;
    font-size: 14px; line-height: 1.35;
  }
  .msg.own { background: #2563eb; align-self: flex-end; }
  .msg .meta {
    font-size: 11px; opacity: .6; margin-bottom: 2px;
  }
  footer {
    padding: 12px 16px; background: #181b22;
    border-top: 1px solid #262a33;
    display: flex; gap: 8px;
    padding-bottom: max(12px, env(safe-area-inset-bottom));
  }
  footer input {
    flex: 1; background: #0f1115;
    border: 1px solid #2a2f3a; color: #e6e6e6;
    padding: 10px 12px; border-radius: 8px;
    font-size: 15px; outline: none;
  }
  footer input:focus { border-color: #2563eb; }
  footer button {
    background: #2563eb; color: #fff; border: 0;
    padding: 0 18px; border-radius: 8px;
    font-size: 15px; cursor: pointer;
  }
  footer button:hover { background: #1d4ed8; }
</style>
</head>
<body>
  <header>
    <input id="name" placeholder="твоё имя" maxlength="32">
    <span class="status" id="status">офлайн</span>
  </header>
  <div id="log"></div>
  <footer>
    <input id="input" placeholder="сообщение..." autocomplete="off">
    <button id="send">→</button>
  </footer>

<script>
  const $ = id => document.getElementById(id);
  const log = $('log'), input = $('input'), sendBtn = $('send'),
        nameEl = $('name'), statusEl = $('status');

  nameEl.value = localStorage.getItem('name') || '';
  nameEl.addEventListener('input', () =>
    localStorage.setItem('name', nameEl.value));

  // АДРЕС СЕРВЕРА НА RENDER
  const SERVER_URL = 'wss://op-messenger.onrender.com';

  let ws, reconnectTimer;

  function connect() {
    ws = new WebSocket(SERVER_URL);

    ws.onopen = () => {
      statusEl.textContent = 'онлайн';
      statusEl.classList.add('on');
    };

    ws.onclose = () => {
      statusEl.textContent = 'офлайн';
      statusEl.classList.remove('on');
      clearTimeout(reconnectTimer);
      reconnectTimer = setTimeout(connect, 2000);
    };

    ws.onmessage = (e) => {
      const data = JSON.parse(e.data);
      if (data.type === 'history') {
        log.innerHTML = '';
        data.messages.forEach(addMessage);
        log.scrollTop = log.scrollHeight;
      } else if (data.type === 'message') {
        addMessage(data);
        log.scrollTop = log.scrollHeight;
      }
    };
  }

  function addMessage(m) {
    const own = m.name === nameEl.value;
    const div = document.createElement('div');
    div.className = 'msg' + (own ? ' own' : '');
    const time = new Date(m.ts).toLocaleTimeString('ru-RU',
      {hour:'2-digit',minute:'2-digit'});
    div.innerHTML =
      `<div class="meta">${escapeHtml(m.name)} · ${time}</div>` +
      escapeHtml(m.text);
    log.appendChild(div);
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c =>
      ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function send() {
    const text = input.value.trim();
    if (!text || !ws || ws.readyState !== 1) return;
    ws.send(JSON.stringify({
      type: 'message',
      name: nameEl.value.trim() || 'anon',
      text
    }));
    input.value = '';
  }

  sendBtn.onclick = send;
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') send();
  });

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }

  connect();
</script>
</body>
</html>
